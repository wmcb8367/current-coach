name: iOS build and tests

# Builds the app and runs its unit tests in a simulator, so a change that
# does not compile is caught on the pull request rather than on a Mac later.
on:
  pull_request:
    paths:
      - "CurrentCoach/**"
      - "CurrentCoachTests/**"
      - "project.yml"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build and test
        run: |
          device=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [0-9]+( Pro| Plus| Pro Max)?' || true)
          echo "Simulator: ${device:-none found}"
          status=0
          xcodebuild test \
            -project CurrentCoach.xcodeproj \
            -scheme CurrentCoach \
            -destination "platform=iOS Simulator,name=${device:-iPhone 16}" \
            CODE_SIGNING_ALLOWED=NO > build.log 2>&1 || status=$?
          # The full log is long: show errors, warnings in our own code, and the test results.
          grep -E "error:|CurrentCoach.*warning:|✔|✘|Test run|\*\* " build.log | tail -200 || true
          exit $status
