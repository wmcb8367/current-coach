name: Publish current model maps

# Each evening at the venue: run the current models on the forecasts in hand
# and publish tomorrow's maps to the server that hands them to the app.
# Run it by hand with a list of days to build past days instead, each from
# what had been issued the evening before it.
on:
  schedule:
    - cron: "20 10 * * *" # 18:20 in Hong Kong
    - cron: "20 23 * * *" # 18:20 in Miami (EST; 19:20 in summer)
  workflow_dispatch:
    inputs:
      days:
        description: "Past UTC days to build, comma separated (YYYY-MM-DD). Empty for the evening's run."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: current-models
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        # One entry per venue. The box is centred on (lat, lon).
        venue:
          - id: hong-kong
            name: Hong Kong
            lat: "22.28"
            lon: "114.36"
            width_km: "44"
            height_km: "38"
            time_zone: Asia/Hong_Kong
            evening_cron: "20 10 * * *"
            options: ""
          # Miami: depths from free NOAA charts, which also open Government Cut;
          # Biscayne Bay from Miami Beach to Elliott Key on 100 m cells, chart depths
          # capped where the Florida Straits drop away, rougher bottom (best match to
          # NOAA's bay tide predictions) and the cuts corrected to NOAA's current predictions.
          - id: miami
            name: Miami
            lat: "25.71"
            lon: "-80.205"
            width_km: "25"
            height_km: "42"
            time_zone: America/New_York
            evening_cron: "20 23 * * *"
            options: >-
              --dx 100 --max-depth 40 --manning 0.035 --chart-datum 0.342
              --current-stations MIH0802:25.760429:-80.126877,MIH0804:25.7646:-80.137428,MIH0807:25.764971:-80.151131,MIH0808:25.77335:-80.156921,MIH0814:25.77038:-80.187477,MIH0901:25.76405:-80.13394
              --charts US4FL2AI,US4FL2AJ,US4FL2BI,US4FL2BJ,US5FL5LM,US5FL5LN,US5FL5MM,US5FL5MN,US5FL5MO,US5MIABA,US5MIABB,US5MIABC,US5MIABD,US5MIACB,US5MIACC,US5MIACD,US5MIADB,US5MIADC,US5MIADD
    steps:
      # A scheduled run builds only the venue whose evening it is.
      - name: Is it this venue's evening
        id: due
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" != "${{ matrix.venue.evening_cron }}" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.due.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.due.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: model/pyproject.toml

      - name: Install the model package
        if: steps.due.outputs.run == 'true'
        run: pip install -e "model[data]"

      # Depths and coastline do not change from night to night.
      - uses: actions/cache@v4
        if: steps.due.outputs.run == 'true'
        with:
          path: model-cache
          key: current-models-${{ matrix.venue.id }}-${{ github.run_id }}
          restore-keys: current-models-${{ matrix.venue.id }}-

      - name: Build and publish
        if: steps.due.outputs.run == 'true'
        env:
          CURRENT_MODELS_UPLOAD_TOKEN: ${{ secrets.CURRENT_MODELS_UPLOAD_TOKEN }}
          SERVER: ${{ vars.CURRENT_MODELS_SERVER || 'https://m2xsailing.com' }}
          DAYS: ${{ inputs.days }}
        run: |
          if [ -z "$CURRENT_MODELS_UPLOAD_TOKEN" ]; then
            if [ "${{ github.event_name }}" = "schedule" ]; then
              echo "::warning::Nothing published: the repository secret CURRENT_MODELS_UPLOAD_TOKEN is not set."
              exit 0
            fi
            echo "::error::The repository secret CURRENT_MODELS_UPLOAD_TOKEN is not set."
            exit 1
          fi
          # Keep the depths and coastline; drop yesterday's weather and ocean downloads.
          rm -rf model-cache/stofs model-cache/gfs model-cache/wind
          python -m currentmodel.publish \
            --venue "${{ matrix.venue.id }}" --name "${{ matrix.venue.name }}" \
            --lat "${{ matrix.venue.lat }}" --lon "${{ matrix.venue.lon }}" \
            --width-km "${{ matrix.venue.width_km }}" --height-km "${{ matrix.venue.height_km }}" \
            --time-zone "${{ matrix.venue.time_zone }}" \
            --server "$SERVER" --cache model-cache ${DAYS:+--days "$DAYS"} ${{ matrix.venue.options }}
